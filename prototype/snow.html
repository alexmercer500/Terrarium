<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium · Snowy Mountains (prototype)</title>
<!--
  Terrarium · Snowy Mountains theme (top-down; WebGL2, 2D)
  Look: a calm winter illustration seen from above.
  - Every desktop icon sits in a clearing of soft blue-grey snow (drifts, sastrugi wind ripples, blue edge shade).
    The snow under icons is kept mid-tone so the white icon labels stay readable.
  - Outside the clearings: dense pine forest (layered star-shaped crowns with snow on the branches and long blue
    shadows); the forest edge hugs the clearing shape with smaller young trees; a few snow-capped rocky outcrops.
  - One small cabin with a smoking chimney sits away from the icons and relocates (fade out / fade in) when icons move there.
  - Light snowfall drifts across the whole screen with gusty wind in four parallax layers.
  Rendering:
  - STATIC pass: ground, rocks, forest and cabin are rendered into a cached texture. It is only re-rendered while the
    clearing field morphs (icons moved), the cabin fades, a setting changes or the canvas size changes.
  - Every frame: one cheap full-screen composite (cache + drifting cloud shade + rare glints), then smoke puffs and
    snowflakes as GL point sprites (positions computed in the vertex shader / tiny CPU particle list).
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a6c46e; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }

  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.24); }
  .icon.sel { background: rgba(0,120,215,.34); border-color: rgba(140,200,255,.7); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .icon.born { animation: born .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes born { from { opacity: 0; transform: scale(.6); } }
  .glyph { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(3px 6px 4px rgba(90,80,110,.25)); pointer-events: none; }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.85);
    word-break: break-all; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(28,32,38,.6); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; z-index: 40;
  }
  #taskbar .apps { display: flex; gap: 4px; }
  #taskbar .app { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  #taskbar .app:hover { background: rgba(255,255,255,.08); }
  #taskbar .app svg { width: 24px; height: 24px; }
  #clock { position: absolute; right: 14px; color: #fff; font-size: 12px; line-height: 16px; text-align: right; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 284px; max-height: calc(100vh - var(--taskbar) - 28px); overflow: auto;
    background: rgba(20,52,64,.74); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    color: #eef6f5; border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.25); z-index: 50;
  }
  #panel.hidden { display: none; }
  body.wall #panel, body.wall #taskbar, body.wall #desktop { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(40,60,90,.28); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
  #panel header b { font-size: 14px; letter-spacing: .06em; }
  #panel header span { margin-left: 8px; opacity: .55; }
  #panel.collapsed .body { display: none; }
  .ibtn { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .ibtn:hover { opacity: 1; }
  #panel .body { padding: 0 14px 14px; }
  .sec { margin-top: 12px; }
  .sec > .t { opacity: .6; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(255,255,255,.17); opacity: 1; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .6; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #7fe3d6; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: #7fe3d6; margin: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button {
    flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 7px 0; border-radius: 7px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1);
  }
  .btns button:hover { background: rgba(255,255,255,.18); }
  #stats { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.25); font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; line-height: 1.6; color: #d4e4e2; }
  #stats .live { color: #7fe3d6; }
  .hint { margin-top: 10px; opacity: .5; font-size: 11px; line-height: 1.6; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
  html, body { background: #7d8ea3; }
  #panel { background: rgba(24,36,52,.76); color: #eef3f8; }
  input[type=range], .toggles input { accent-color: #a9d2ff; }
  #stats { color: #d6e0ea; }
  #stats .live { color: #a9d2ff; }
</style>
</head>

<aside id="panel">

<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;                 // clearing field grid (CSS px)
const MORPH_MS = 1800;
const TG = 36;                  // forest cell size (one tree candidate per cell)
const RG = 150;                 // rock cell size (at most one outcrop per cell)

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');      // loaded by the Windows host as the wallpaper
const PREVIEW = QS.has('preview');     // inside the settings window iframe
// Defaults must equal the `default` values of the snow entry in themes.json
const P = {
  sigma: 70, snowfall: 0.5, wind: 1, trees: 0.75,
  warp: 40, quality: 2,
  debug: false, snap: true, cap30: true,
  showCabin: 1, adaptive: 1,
};
const DEFAULTS = Object.assign({}, P);
const DISPLAY_KEYS = ['showCabin', 'adaptive'];
const pct = v => Math.round(v * 100) + '%';
const SLIDERS = [
  { key: 'sigma',    label: 'Clearing size',  min: 40, max: 200, step: 1,    fmt: v => v + ' px', act: 'field' },
  { key: 'trees',    label: 'Forest density', min: 0,  max: 1,   step: 0.01, fmt: pct, act: 'scene' },
  { key: 'snowfall', label: 'Snowfall',       min: 0,  max: 1,   step: 0.01, fmt: pct },
  { key: 'wind',     label: 'Wind',           min: 0,  max: 3,   step: 0.05, fmt: v => '×' + v.toFixed(2) },
];

/* ======================================================================
   Mock desktop icons (standalone demo only)
   ====================================================================== */
const PAGE = '<path d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fbfbfb" stroke="#c4c4c4"/><path d="M29 4v7a2 2 0 0 0 2 2h7z" fill="#dedede"/>';
const LINES = '<path d="M24 20h10M24 25h10M24 30h10M24 35h10" stroke="#c9c9c9" stroke-width="1.6"/>';
const badge = (color, text, size = 11) => `<rect x="4" y="21" width="19" height="19" rx="3" fill="${color}"/><text x="13.5" y="34.5" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="${size}" fill="#fff">${text}</text>`;
const SVG = {
  folder: '<path d="M4 12a3 3 0 0 1 3-3h11l4 4h19a3 3 0 0 1 3 3v2H4z" fill="#e09b1d"/><path d="M4 17h40v20a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#ffc83d"/><path d="M4 17h40v2.5H4z" fill="#ffd978"/>',
  docx: PAGE + LINES + badge('#185abd', 'W'),
  xlsx: PAGE + '<path d="M24 19h11v17H24zM24 24.5h11M24 30h11M29.5 19v17" stroke="#9ac9a9" stroke-width="1.3" fill="none"/>' + badge('#107c41', 'X'),
  pdf:  PAGE + LINES + badge('#d33a2c', 'PDF', 7.5),
  cad:  PAGE + LINES + badge('#2a7fd4', 'DWG', 7),
  txt:  PAGE + '<path d="M16 18h16M16 23h16M16 28h16M16 33h10" stroke="#9a9a9a" stroke-width="1.6"/>',
  png:  PAGE + '<rect x="14" y="17" width="20" height="17" rx="1.5" fill="#8fd0f5"/><path d="M14 30l6-6 5 5 3-3 6 6v1.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 14 34z" fill="#3fa35a"/><circle cx="29" cy="21.5" r="2" fill="#fff4b8"/>',
  shot: '<rect x="3" y="13" width="42" height="25" rx="1" fill="#1d2129" stroke="#f2f2f2" stroke-width="1.5"/><rect x="6" y="16" width="14" height="3" fill="#5b8def"/><rect x="6" y="21" width="22" height="2" fill="#6c7280"/><rect x="6" y="25" width="18" height="2" fill="#6c7280"/><rect x="31" y="16" width="11" height="18" fill="#2e3440"/>',
  zip:  PAGE + '<path d="M22 4v4h3v3h-3v3h3v3h-3v3h3v3h-3" stroke="#8a6d3b" stroke-width="2" fill="none"/><rect x="20" y="26" width="7" height="8" rx="1" fill="#8a6d3b"/>',
  bin:  '<path d="M12 14h24l-2.5 27a3 3 0 0 1-3 2.7H17.5a3 3 0 0 1-3-2.7z" fill="rgba(215,235,250,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1.2"/><path d="M10 12.5h28" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 19l1 19M24 19v19M29 19l-1 19" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>',
  pc:   '<rect x="5" y="8" width="38" height="26" rx="2" fill="#1f8fe0" stroke="#bfe3ff" stroke-width="1.5"/><path d="M5 30h38" stroke="#0d5fa8" stroke-width="3"/><path d="M19 34l-2 6h14l-2-6z" fill="#9aa7b4"/>',
};
const APP_COLORS = ['#e8553e','#2f7de1','#18a058','#8b5cf6','#f59e0b','#0ea5a4','#db2777','#334155','#16a34a','#2563eb'];
function appSVG(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `<rect x="5" y="5" width="38" height="38" rx="9" fill="${APP_COLORS[h % APP_COLORS.length]}"/><path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v6H5z" fill="#fff" opacity=".14"/>` +
    `<text x="24" y="31.5" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="18" fill="#fff">${[...name][0]}</text>`;
}
const glyphOf = (name, type) => type === 'app' ? appSVG(name) : SVG[type];

const FILES = [
  ['Recycle Bin','bin'], ['Projects','folder'], ['Quote 2026.xlsx','xlsx'], ['Product spec.docx','docx'],
  ['Screenshot_0927.png','png'], ['Contract scan.pdf','pdf'], ['New folder','folder'], ['Design assets','folder'],
  ['Travel photos','folder'], ['Installer.zip','zip'], ['Meeting notes.docx','docx'], ['Wallpaper ideas','folder'],
  ['Weekly report.xlsx','xlsx'], ['Sketch.png','png'], ['Old backup','folder'], ['Photo.png','png'], ['Manual.pdf','pdf'], ['Resume.docx','docx'],
  ['Expenses.xlsx','xlsx'], ['Backup.zip','zip'], ['Reference.png','png'], ['Downloads','folder'], ['Stickers.png','png'], ['Payslip.xlsx','xlsx'],
  ['Lease.pdf','pdf'], ['Journal.docx','docx'], ['Desktop.png','png'],
];
const EXTRA = [
  ['New Text Document.txt','txt'], ['New folder (2)','folder'], ['Invoice.pdf','pdf'], ['Export.xlsx','xlsx'],
  ['Screenshot_0928.png','png'], ['Memo.txt','txt'], ['Archive.zip','zip'], ['New folder (3)','folder'],
];
const APPS = ['Recycle Bin','This PC','Mail','Slack','Teams','Zoom','Spotify','DaVinci Resolve','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','Dropbox','Chrome','Blender','Figma','Notion','Discord','Steam','Eagle','OBS','Postman','PureRef','Recorder','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['Games','folder'],['todolist','folder'],['OKR.xlsx','xlsx'],['Fixed costs.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['part.stp','txt'],['part.3dm','png'],['Preview','folder']];
const RIGHT = [['plot.log','txt'],['Tools','folder'],['archive.rar','zip'],['1685x128.png','png'],['image.jpg','png'],['0914.png','png'],
  ['image 2.jpg','png'],['images.png','png'],['Contents.docx','docx'],['api.txt','txt'],['c4ef.png','png'],['0918.png','png'],
  ['Board.pdf','pdf'],['recommend.txt','txt'],['button.stp','txt'],['New Text (2).txt','txt'],['ugstep21','txt'],['New Text (3).txt','txt'],
  ['Plan.txt','txt'],['image 3.jpg','png'],['New DOCX.docx','docx'],['SEO.txt','txt'],['resend.txt','txt'],['Product intro.txt','txt'],
  ['USER.pdf','pdf'],['New Text.txt','txt'],['Chair.pur','png'],['PAP-20.pdf','pdf'],['Slides.pptx','pdf'],['Issues.txt','txt']];
function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];
    out.push([c, r, name, name === 'Recycle Bin' ? 'bin' : name === 'This PC' ? 'pc' : 'app']);
  }
  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `Part ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, 'leg-test.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])
    out.push([c, r, `ScreenShot ${++sh}.png`, 'shot']);
  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],
    [16,4],[16,6],[17,4],[17,5],[17,6],[17,7],[19,4],[19,5],[19,8],[20,0],[20,4],[20,6],[21,0],[21,5],[21,6]]) {
    const f = RIGHT[rgt++ % RIGHT.length]; out.push([c, r, f[0], f[1]]);
  }
  return out;
}

/* ======================================================================
   CPU noise + tileable noise texture
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

/* ======================================================================
   Clearing field (CPU): s = signed distance to the clearing edge (< 0 inside a clearing)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  // Floor = contribution at the edge of the evaluated window, so no box-shaped seams far from icons
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS_FULL = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// Shared GLSL helpers
const GLSL_COMMON = `
const float TAU = 6.28318531;
const vec2 SUN = vec2(-0.78, -0.62);        // direction towards the low winter sun (upper left)
const vec2 SHV = vec2(0.78, 0.62);          // shadows fall to the lower right
float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
`;

/* ---------- STATIC pass: ground + rocks + forest + cabin, rendered into the cache texture ---------- */
const FS_STATIC = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uNoise, uFA, uFB;
uniform highp sampler2D uTree, uRock;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uDebug;
uniform vec3 uTG;          // tree grid: cell size, cols, rows (texel (0,0) = screen cell (-2,-2))
uniform vec3 uRG;          // rock grid: cell size, cols, rows (texel (0,0) = screen cell (-1,-1))
uniform vec4 uCabin;       // x, y, visibility, angle
out vec4 o;
${GLSL_COMMON}

// ---- palette ----
const vec3 SNOW_LT   = vec3(0.665, 0.72, 0.805);  // open snow, sunlit side of drifts (still mid tone)
const vec3 SNOW_SH   = vec3(0.475, 0.545, 0.665); // open snow, shaded side of drifts
const vec3 SNOW_DEEP = vec3(0.24, 0.31, 0.42);    // forest floor
const vec3 SHADOW_MUL = vec3(0.58, 0.66, 0.84);   // cast shadows: blue
const vec3 PINE_LT = vec3(0.25, 0.40, 0.35);
const vec3 PINE_SH = vec3(0.055, 0.135, 0.15);
const vec3 TSNOW_LT = vec3(0.90, 0.93, 0.975);    // snow on branches / roofs / rocks
const vec3 TSNOW_SH = vec3(0.56, 0.645, 0.78);
const vec3 STONE_LT = vec3(0.52, 0.52, 0.55);
const vec3 STONE_SH = vec3(0.20, 0.215, 0.255);
const vec3 WOOD = vec3(0.30, 0.20, 0.15);
const vec3 WARM = vec3(1.0, 0.72, 0.40);

float h1(float n) { return fract(sin(n) * 43758.5453123); }
vec4 N(vec2 p, float sc) { return texture(uNoise, p / sc + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }
float field(vec2 p) { return mix(fieldS(uFA, p), fieldS(uFB, p), uMix); }
float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

// value noise with analytic derivatives (quintic) -> smooth drift shading without texture faceting
vec3 noised(vec2 x) {
  vec2 i = floor(x), f = fract(x);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec2 k = vec2(uSeed * 1.7, uSeed * 0.9);
  float a = hash2(i + k), b = hash2(i + k + vec2(1.0, 0.0)), c = hash2(i + k + vec2(0.0, 1.0)), d = hash2(i + k + vec2(1.0, 1.0));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du * vec2(k1 + k4 * u.y, k2 + k4 * u.x));
}

// ---- open snow: wind-blown drifts, sastrugi ripples, blue shade towards the forest edge ----
vec3 groundSnow(vec2 p, float s, out float lit) {
  // drift height gradient (px of height per px)
  vec3 n1 = noised(p / 300.0), n2 = noised(p / 110.0 + 17.0), n3 = noised(p * vec2(1.0, 2.2) / 60.0 + 41.0);
  vec2 g = n1.yz * (34.0 / 300.0) + n2.yz * (6.0 / 110.0) + n3.yz * vec2(1.0, 2.2) * (1.2 / 60.0);
  lit = clamp(0.55 - dot(g, SUN) * 2.3, 0.0, 1.0);
  vec3 c = mix(SNOW_SH, SNOW_LT, lit);
  // sastrugi: ripples across the wind (wind blows left -> right); gentle lit windward slope, thin blue lee shadow
  vec2 wd = vec2(0.97, 0.243), wp = vec2(-wd.y, wd.x);
  float along = dot(p, wd), across = dot(p, wp);
  float warp = (N(p, 520.0).g - 0.5) * 110.0 + (N(p, 170.0).r - 0.5) * 24.0;
  float f = fract((along + warp) / 15.0);
  float rip = ss(0.1, 0.78, f) - 2.0 * ss(0.78, 0.9, f) + ss(0.9, 1.0, f);
  float patchM = ss(0.42, 0.7, N(p + 500.0, 700.0).a) * ss(0.32, 0.62, N(vec2(across, along * 3.0) + 900.0, 260.0).b);
  c += rip * patchM * 0.028 * vec3(0.85, 0.92, 1.0);
  // fine grain of the snow (per real pixel)
  c *= 1.0 + (hash2(floor(p * max(uScale, 1.0)) + 7.0) - 0.5) * 0.022;
  // large-scale light: a touch brighter towards the sun (upper left)
  c *= 1.0 + 0.06 * (0.5 - (p.x / uRes.x * 0.6 + p.y / uRes.y * 0.4));
  // soft blue shade near the forest edge (inside the clearing)
  c = mix(c, c * vec3(0.80, 0.86, 0.98), ss(-55.0, 4.0, s) * 0.45);
  return c;
}

// ---- pine crowns ----
// Star outline of one tier in direction a: m branches, rot = rotation in branches. bx = across-branch coord (-0.5..0.5)
float prof(float a, float m, float rot, float sd, out float bx) {
  float f = a * (m / TAU) + rot;
  float bi = floor(f);
  bx = f - bi - 0.5;
  float bs = abs(bx) * 2.0;
  float len = 0.84 + 0.2 * h1(mod(bi, m) * 7.13 + sd * 91.7);
  return 0.66 + 0.34 * pow(1.0 - bs, 1.2) * len + 0.03 * sin(f * TAU * 4.0) * (1.0 - bs);
}
float tierR(float R, float fi, float nT) { return R * mix(1.0, 0.26, fi / (nT - 1.0)); }
// Topmost tier hit at offset v. Returns coverage (anti-aliased only on the outermost rim).
float crown(vec2 v, float R, float sd, float aa, out float k, out float u, out float bx, out float nT) {
  k = 0.0; u = 1.0; bx = 0.0; nT = R > 16.0 ? 4.0 : 3.0;
  float r = length(v);
  if (r > R * 1.06 + aa) return 0.0;
  float a = atan(v.y, v.x);
  for (int i = 3; i >= 0; i--) {
    float fi = float(i);
    if (fi > nT - 1.0) continue;
    float b;
    float Rt = tierR(R, fi, nT) * prof(a, 10.0 - fi, sd * 13.0 + fi * 0.5, sd + fi, b);
    if (i == 0) {
      float cov = clamp((Rt - r) / aa + 0.5, 0.0, 1.0);
      if (cov > 0.0) { k = 0.0; u = min(r / Rt, 1.0); bx = b; }
      return cov;
    }
    if (r < Rt) { k = fi; u = r / Rt; bx = b; return 1.0; }
  }
  return 0.0;
}
vec3 shadeCrown(vec2 p, vec2 v, float R, float sd, float aa) {
  float k, u, bx, nT;
  crown(v, R, sd, aa, k, u, bx, nT);
  float r = max(length(v), 1e-3);
  vec2 dir = v / r, tg = vec2(-dir.y, dir.x);
  float radial = dot(dir, SUN);                       // sunny side of the cone
  float facet = sign(bx) * dot(tg, SUN);              // each branch: one half catches the sun
  float tip = ss(0.68, 1.0, u), bs = abs(bx) * 2.0;
  float L = 0.40 + 0.30 * radial + 0.17 * facet * (0.35 + 0.65 * u) + 0.08 * k / nT;
  vec3 col = mix(PINE_SH, PINE_LT, clamp(L + (N(p + sd * 300.0, 30.0).r - 0.5) * 0.18, 0.0, 1.0));
  col = mix(col, PINE_SH * 0.75, ss(0.55, 1.0, bs) * 0.55);   // dark gaps between branches
  col *= 1.0 - 0.2 * tip;
  // the tier above casts a short shadow onto this tier
  float cs = 0.0;
  if (k < nT - 1.0) {
    vec2 w = v - SHV * R * 0.2;
    float b2, fi = k + 1.0;
    float Rt = tierR(R, fi, nT) * prof(atan(w.y, w.x), 10.0 - fi, sd * 13.0 + fi * 0.5, sd + fi, b2);
    cs = ss(1.2, -1.2, length(w) - Rt);
    col *= mix(1.0, 0.45, cs);
  }
  // snow resting along each branch, in clumps
  float sn = N(p + sd * 517.0, 15.0).g * 0.8 + N(p + sd * 211.0, 7.0).r * 0.2;
  float amt = 0.3 - bs * 0.5 - u * 0.3 + (sn - 0.5) * 1.0 - tip * 0.5 + 0.12 * radial - cs * 0.3 + 0.1 * k / nT;
  if (k >= nT - 1.0) amt += (1.0 - u) * 0.35;
  float snow = ss(-0.03, 0.09, amt);
  vec3 sc = mix(TSNOW_SH, TSNOW_LT, clamp(0.52 + 0.4 * radial + 0.22 * facet - cs * 0.55, 0.0, 1.0));
  return mix(col, sc, snow);
}
// teardrop shadow of a crown on the ground
float treeShadow(vec2 v, float R) {
  vec2 d = SHV * R * 1.1;
  float t = clamp(dot(v, d) / dot(d, d), 0.0, 1.0);
  return ss(2.0, -2.0, length(v - d * t) - mix(R * 0.9, R * 0.2, t));
}

// ---- rocky outcrops: 2-3 chunky polygon blocks; fn = normal of the nearest face ----
float rockSD(vec2 v, float S, float sd, out vec2 fn) {
  float d = 1e9; fn = vec2(0.0);
  int nb = h1(sd * 3.1) < 0.45 ? 2 : 3;
  for (int b = 0; b < 3; b++) {
    if (b >= nb) break;
    float fb = float(b);
    vec2 off = b == 0 ? vec2(0.0) : (vec2(h1(sd * 7.3 + fb), h1(sd * 5.9 + fb * 3.0)) - 0.5) * S * 1.15;
    float rad = S * (b == 0 ? 0.62 : 0.36 + 0.2 * h1(sd * 2.7 + fb));
    vec2 w = v - off;
    float db = -1e9; vec2 nn = vec2(0.0);
    for (int i = 0; i < 6; i++) {
      float fi = float(i);
      float ang = (fi + 0.4 * h1(sd * 11.0 + fb * 7.0 + fi)) * TAU / 6.0 + sd * 5.0 + fb;
      vec2 n = vec2(cos(ang), sin(ang));
      float di = dot(w, n) - rad * (0.84 + 0.16 * h1(sd * 13.0 + fb * 3.0 + fi));
      if (di > db) { db = di; nn = n; }
    }
    if (db < d) { d = db; fn = nn; }
  }
  return d;
}

// ---- the cabin (local, early-out far away) ----
vec3 cabinLayer(vec3 col, vec2 p, float aa, inout float spark) {
  float vis = uCabin.z;
  vec2 q = p - uCabin.xy;
  if (vis <= 0.002 || dot(q, q) > 150.0 * 150.0) return col;
  float ca = cos(uCabin.w), sa = sin(uCabin.w);
  mat2 toL = mat2(ca, -sa, sa, ca);                   // world -> cabin local (rotate by -angle)
  vec2 l = toL * q, shvL = toL * SHV, sunL = -shvL;
  const vec2 HB = vec2(31.0, 20.0);                   // half size of the roof
  const float WALL_H = 8.0;                           // the south log wall shows below the eave
  vec3 c = col;
  float sp = spark;
  float yb = HB.y + WALL_H;                           // bottom of the south wall
  // trodden yard
  c = mix(c, c * vec3(0.94, 0.955, 1.0), ss(70.0, 34.0, length((l - vec2(0.0, 6.0)) * vec2(0.8, 1.0))) * 0.6);
  // footpath from the door, winding away to the south-west, with footprints
  float py = l.y - yb;
  if (py > -2.0) {
    float cx = -3.0 - py * 0.32 + sin(py * 0.05) * 8.0;
    float pm = ss(1.6, -1.6, abs(l.x - cx) - 4.6) * ss(110.0, 50.0, py);
    float row = floor(py / 8.0), side = mod(row, 2.0) * 2.0 - 1.0;
    vec2 fp = vec2(l.x - cx - side * 2.0, py - row * 8.0 - 4.0);
    float foot = ss(1.6, 0.6, length(fp * vec2(1.0, 0.6)));
    c = mix(c, c * vec3(0.86, 0.9, 0.97), pm * 0.55);
    c = mix(c, c * vec3(0.74, 0.8, 0.94), foot * pm * 0.55);
    sp *= 1.0 - pm;
  }
  // house shadow (roof + wall) towards the lower right
  float hs = sdBox(l - shvL * 13.0 - vec2(0.0, WALL_H * 0.5), HB + vec2(0.0, WALL_H * 0.5), 4.0);
  c *= mix(vec3(1.0), SHADOW_MUL, ss(2.0, -2.0, hs) * 0.88);
  // warm light from the windows and the door spilling onto the snow in front
  float glow = ss(15.0, 0.0, length((l - vec2(-17.0, yb + 4.0)) * vec2(0.8, 1.3)))
             + ss(15.0, 0.0, length((l - vec2(15.0, yb + 4.0)) * vec2(0.8, 1.3)))
             + 0.9 * ss(17.0, 0.0, length((l - vec2(-3.0, yb + 3.0)) * vec2(1.0, 1.1)));
  c += WARM * glow * 0.2;
  // woodpile against the east gable
  vec2 wl = l - vec2(HB.x + 7.0, 3.0);
  c *= mix(vec3(1.0), SHADOW_MUL, ss(1.5, -1.5, sdBox(wl - shvL * 4.0, vec2(4.6, 11.0), 1.5)) * 0.8);
  float wpd = sdBox(wl, vec2(4.6, 11.0), 1.5);
  if (wpd < aa) {
    float lg = fract(wl.x / 3.0 + 0.5);
    vec3 wc = mix(WOOD * 0.55, WOOD * 1.6, ss(0.05, 0.6, lg) * (1.0 - ss(0.75, 1.0, lg)));
    float wsnow = ss(0.0, 0.1, 0.5 - abs(wl.x + 1.0) / 4.6 * 0.6 + (N(p, 7.0).r - 0.5) * 0.8);
    wc = mix(wc, mix(TSNOW_SH, TSNOW_LT, 0.65), wsnow);
    float cov = clamp(0.5 - wpd / aa, 0.0, 1.0);
    c = mix(c, wc, cov); sp *= 1.0 - cov;
  }
  // south log wall (in shade), windows glowing warm, a dark door
  float wd = sdBox(l - vec2(0.0, HB.y + WALL_H * 0.5 - 1.0), vec2(HB.x - 3.0, WALL_H * 0.5 + 1.0), 0.8);
  if (wd < aa) {
    float ly = l.y - HB.y;
    vec3 wc = WOOD * (0.75 + 0.5 * ss(0.15, 0.6, fract(ly / 2.6)) * (1.0 - ss(0.75, 1.0, fract(ly / 2.6))));
    wc *= 0.9 + 0.2 * hash2(vec2(floor(ly / 2.6), floor(l.x / 9.0)));
    float win = min(sdBox(l - vec2(-17.0, HB.y + 4.0), vec2(3.6, 2.2), 0.5), sdBox(l - vec2(15.0, HB.y + 4.0), vec2(3.6, 2.2), 0.5));
    wc = mix(wc, vec3(1.0, 0.82, 0.52), ss(0.6, -0.6, win));
    wc = mix(wc, vec3(0.16, 0.10, 0.07), ss(0.6, -0.6, sdBox(l - vec2(-3.0, HB.y + 4.5), vec2(3.2, 4.0), 0.4)));
    float cov = clamp(0.5 - wd / aa, 0.0, 1.0);
    c = mix(c, wc, cov); sp *= 1.0 - cov;
  }
  // roof: thick snow, the north slope faces the low sun
  float dR = sdBox(l, HB, 4.5);
  // icicles hanging from the south eave
  float icx = fract(l.x / 3.1), icl = 1.0 + 3.5 * hash2(vec2(floor(l.x / 3.1), 9.0));
  float ice = ss(0.5, 0.15, abs(icx - 0.5)) * ss(icl, icl - 1.2, l.y - HB.y) * step(HB.y - 1.0, l.y) * step(abs(l.x), HB.x - 4.0);
  c = mix(c, vec3(0.82, 0.9, 1.0), ice * 0.85);
  if (dR < aa) {
    float north = l.y < 0.0 ? 1.0 : 0.0;
    float slopeL = dot(vec2(0.0, north > 0.5 ? -1.0 : 1.0), sunL);
    vec3 roof = mix(TSNOW_SH, TSNOW_LT, clamp(0.58 + 0.45 * slopeL, 0.0, 1.0));
    roof *= 1.0 + (N(p, 30.0).r - 0.5) * 0.06;
    roof = mix(roof, roof * 0.82, ss(1.4, 0.0, abs(l.y + 0.4)));           // ridge
    roof = mix(roof, roof * vec3(0.82, 0.87, 0.97), ss(-5.0, 0.0, dR) * (0.4 + 0.4 * (1.0 - north)));  // rounded snow edge
    // bargeboards: a little wood at the gable ends only
    float gable = ss(HB.x - 2.6, HB.x - 1.0, abs(l.x)) * ss(0.0, -2.0, dR + 0.0) * (0.5 + 0.5 * N(p, 6.0).g);
    roof = mix(roof, WOOD * 1.1, gable * 0.8);
    // chimney (stone) on the north slope, with its shadow on the roof
    vec2 cl = l - vec2(14.0, -10.0);
    roof *= mix(1.0, 0.68, ss(1.0, -1.0, sdBox(cl - shvL * 5.5, vec2(4.2), 0.8)));
    float chd = sdBox(cl, vec2(4.2), 0.8);
    if (chd < aa) {
      float L = clamp(0.5 + 0.5 * dot(normalize(cl + 1e-3), sunL), 0.0, 1.0);
      vec3 st = mix(vec3(0.30, 0.27, 0.26), vec3(0.60, 0.55, 0.52), L);
      st *= 0.85 + 0.3 * hash2(floor(cl * 0.55 + 3.0));
      st = mix(st, TSNOW_LT, ss(0.0, 0.6, -cl.y - 1.5) * ss(-0.5, -2.0, chd) * 0.8);       // snow on the rim
      st = mix(st, vec3(0.05, 0.04, 0.04), ss(0.6, -0.6, sdBox(cl, vec2(2.1), 0.5)));   // flue
      roof = mix(roof, st, clamp(0.5 - chd / aa, 0.0, 1.0));
    }
    float cov = clamp(0.5 - dR / aa, 0.0, 1.0);
    c = mix(c, roof, cov); sp *= 1.0 - cov;
  }
  spark = mix(spark, sp, vis);
  return mix(col, c, vis);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float aa = 1.0 / uScale;
  float s = field(p);
  float lit;
  vec3 col = groundSnow(p, s, lit);
  float spark = lit;

  // ---------- rocky outcrops ----------
  ivec2 r0 = ivec2(floor(p / uRG.x)) + 1;
  ivec2 rgs = ivec2(uRG.yz);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = r0 + ivec2(i, j);
    if (c.x < 0 || c.y < 0 || c.x >= rgs.x || c.y >= rgs.y) continue;
    vec4 rk = texelFetch(uRock, c, 0);
    if (rk.z <= 0.0) continue;
    vec2 v = p - rk.xy;

  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);                                   // an unbroken forest until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical px -> CSS px
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: clearings open up; later: morph smoothly
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => {
      if (ev.source !== parent) return;
      try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) { }
    });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { } });
  host.postMessage('ready');
}
</script>
