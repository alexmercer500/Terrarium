<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium · Coral Reef</title>
<!--
  Terrarium · Coral Reef theme (top-down, WebGL2)
  - Every desktop icon sits on a reef flat: warm sand ringed by coral (brain, branching, fan, sponge)
    with seagrass tufts, urchins and the odd starfish. Away from the icons the water drops off to deep teal/blue,
    with a few small coral bommies scattered in open water.
  - The bed (sand, coral, seagrass, depth tint) is static: it is rendered once per field change into a texture.
    Every frame only a cheap water pass runs (refraction shimmer + caustics from a noise / Voronoi texture),
    then fish schools and a sea turtle are drawn as small instanced quads with their soft shadows.
  - Fish schools follow their leader's trail; leaders steer around reef patches using the field gradient.
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d5a72; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }

  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.24); }
  .icon.sel { background: rgba(0,120,215,.34); border-color: rgba(140,200,255,.7); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .icon.born { animation: born .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes born { from { opacity: 0; transform: scale(.6); } }
  .glyph { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(3px 6px 4px rgba(20,60,80,.25)); pointer-events: none; }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.85);
    word-break: break-word; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(20,30,38,.6); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; z-index: 40;
  }
  #taskbar .apps { display: flex; gap: 4px; }
  #taskbar .app { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  #taskbar .app:hover { background: rgba(255,255,255,.08); }
  #taskbar .app svg { width: 24px; height: 24px; }
  #clock { position: absolute; right: 14px; color: #fff; font-size: 12px; line-height: 16px; text-align: right; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 284px; max-height: calc(100vh - var(--taskbar) - 28px); overflow: auto;
    background: rgba(8,44,60,.76); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    color: #eef6f5; border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.25); z-index: 50;
  }
  #panel.hidden { display: none; }
  /* Wallpaper mode (?wallpaper=1, loaded by the desktop host): Windows draws the real icons and taskbar */
  body.wall #panel, body.wall #taskbar, body.wall #desktop { display: none; }
  /* Preview mode (?preview=1, inside the settings window): translucent boxes mark where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(10,50,70,.28); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
  #panel header b { font-size: 14px; letter-spacing: .06em; }
  #panel header span { margin-left: 8px; opacity: .55; }
  #panel.collapsed .body { display: none; }
  .ibtn { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .ibtn:hover { opacity: 1; }
  #panel .body { padding: 0 14px 14px; }
  .sec { margin-top: 12px; }
  .sec > .t { opacity: .6; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(255,255,255,.17); opacity: 1; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .6; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #ff9a7a; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: #ff9a7a; margin: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button {
    flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 7px 0; border-radius: 7px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1);
  }
  .btns button:hover { background: rgba(255,255,255,.18); }
  #stats { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.25); font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; line-height: 1.6; color: #d4e4e2; }
  #stats .live { color: #ffb49a; }
  .hint { margin-top: 10px; opacity: .5; font-size: 11px; line-height: 1.6; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>

<div id="taskbar">
  <div class="apps">
    <div class="app"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#4cc2ff"/></svg></div>
    <div class="app"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M15 15l5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>

  </div>

</div>

<aside id="panel">
  <header>
    <div><b>Terrarium</b><span>Coral Reef · prototype</span></div>
    <div><button class="ibtn" id="collapse" title="Collapse">–</button></div>
  </header>
  <div class="body">
    <div class="sec"><div class="t">Desktop layout</div>
      <div class="seg">
        <button data-v="mine">Busy</button><button data-v="arranged">Arranged</button><button data-v="messy">Messy</button><button data-v="minimal">Minimal</button>
      </div>
    </div>
    <div class="sec" id="sliders"></div>
    <div class="sec toggles">
      <label><input type="checkbox" data-key="showTurtle">Sea turtle</label>
      <label><input type="checkbox" data-key="snap">Snap to grid</label>
      <label><input type="checkbox" data-key="cap30">Cap 30 fps</label>
    </div>
    <div class="sec btns">
      <button id="btnAdd">+ New file</button>
      <button id="btnSeed">New reef</button>

    <div class="hint">Drag icons: the reef regrows around them<br>Del deletes · H hides this panel</div>
  </div>

<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');      // wallpaper mode: loaded by the desktop host, messages come from the host
const PREVIEW = QS.has('preview');     // preview mode: settings window iframe, messages come from the parent page
// Defaults must match the `default` values of the reef entry in themes.json; quality is not exposed
const P = {
  sigma: 72, caustics: 0.6, fish: 0.5, flow: 1, quality: 2,
  snap: true, cap30: true,
  showTurtle: 1, adaptive: 1,
};
const DEFAULTS = Object.assign({}, P);
const DISPLAY_KEYS = ['showTurtle', 'adaptive'];
const SLIDERS = [
  { key: 'sigma',    label: 'Reef size',   min: 40, max: 200, step: 1,    fmt: v => v + ' px', act: 'field' },
  { key: 'caustics', label: 'Caustics',    min: 0,  max: 1,   step: 0.01, fmt: v => Math.round(v * 100) + '%' },
  { key: 'fish',     label: 'Fish',        min: 0,  max: 1,   step: 0.01, fmt: v => Math.round(v * 100) + '%' },
  { key: 'flow',     label: 'Swim speed',  min: 0,  max: 3,   step: 0.05, fmt: v => '×' + v.toFixed(2) },
];

/* ======================================================================
   Mock desktop icons and layouts (standalone demo only)
   ====================================================================== */
const PAGE = '<path d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fbfbfb" stroke="#c4c4c4"/><path d="M29 4v7a2 2 0 0 0 2 2h7z" fill="#dedede"/>';
const LINES = '<path d="M24 20h10M24 25h10M24 30h10M24 35h10" stroke="#c9c9c9" stroke-width="1.6"/>';
const badge = (color, text, size = 11) => `<rect x="4" y="21" width="19" height="19" rx="3" fill="${color}"/><text x="13.5" y="34.5" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="${size}" fill="#fff">${text}</text>`;
const SVG = {
  folder: '<path d="M4 12a3 3 0 0 1 3-3h11l4 4h19a3 3 0 0 1 3 3v2H4z" fill="#e09b1d"/><path d="M4 17h40v20a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#ffc83d"/><path d="M4 17h40v2.5H4z" fill="#ffd978"/>',
  docx: PAGE + LINES + badge('#185abd', 'W'),
  xlsx: PAGE + '<path d="M24 19h11v17H24zM24 24.5h11M24 30h11M29.5 19v17" stroke="#9ac9a9" stroke-width="1.3" fill="none"/>' + badge('#107c41', 'X'),
  pdf:  PAGE + LINES + badge('#d33a2c', 'PDF', 7.5),
  cad:  PAGE + LINES + badge('#2a7fd4', 'DWG', 7),
  txt:  PAGE + '<path d="M16 18h16M16 23h16M16 28h16M16 33h10" stroke="#9a9a9a" stroke-width="1.6"/>',
  png:  PAGE + '<rect x="14" y="17" width="20" height="17" rx="1.5" fill="#8fd0f5"/><path d="M14 30l6-6 5 5 3-3 6 6v1.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 14 34z" fill="#3fa35a"/><circle cx="29" cy="21.5" r="2" fill="#fff4b8"/>',
  shot: '<rect x="3" y="13" width="42" height="25" rx="1" fill="#1d2129" stroke="#f2f2f2" stroke-width="1.5"/><rect x="6" y="16" width="14" height="3" fill="#5b8def"/><rect x="6" y="21" width="22" height="2" fill="#6c7280"/><rect x="6" y="25" width="18" height="2" fill="#6c7280"/><rect x="31" y="16" width="11" height="18" fill="#2e3440"/>',
  zip:  PAGE + '<path d="M22 4v4h3v3h-3v3h3v3h-3v3h3v3h-3" stroke="#8a6d3b" stroke-width="2" fill="none"/><rect x="20" y="26" width="7" height="8" rx="1" fill="#8a6d3b"/>',
  bin:  '<path d="M12 14h24l-2.5 27a3 3 0 0 1-3 2.7H17.5a3 3 0 0 1-3-2.7z" fill="rgba(215,235,250,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1.2"/><path d="M10 12.5h28" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 19l1 19M24 19v19M29 19l-1 19" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>',
  pc:   '<rect x="5" y="8" width="38" height="26" rx="2" fill="#1f8fe0" stroke="#bfe3ff" stroke-width="1.5"/><path d="M5 30h38" stroke="#0d5fa8" stroke-width="3"/><path d="M19 34l-2 6h14l-2-6z" fill="#9aa7b4"/>',
};
const APP_COLORS = ['#e8553e','#2f7de1','#18a058','#8b5cf6','#f59e0b','#0ea5a4','#db2777','#334155','#16a34a','#2563eb'];
function appSVG(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `<rect x="5" y="5" width="38" height="38" rx="9" fill="${APP_COLORS[h % APP_COLORS.length]}"/><path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v6H5z" fill="#fff" opacity=".14"/>` +
    `<text x="24" y="31.5" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="18" fill="#fff">${[...name][0]}</text>`;
}
const glyphOf = (name, type) => type === 'app' ? appSVG(name) : SVG[type];

const FILES = [
  ['Recycle Bin','bin'], ['Projects','folder'], ['2026 Quote.xlsx','xlsx'], ['Product spec.docx','docx'],
  ['Screenshot_0927.png','png'], ['Contract scan.pdf','pdf'], ['New folder','folder'], ['Design assets','folder'],
  ['Travel photos','folder'], ['Installer.zip','zip'], ['Meeting notes.docx','docx'], ['Wallpaper ideas','folder'],
  ['Weekly report.xlsx','xlsx'], ['Sketch.png','png'], ['Old backup','folder'], ['Photo.png','png'], ['Manual.pdf','pdf'], ['Resume.docx','docx'],
  ['Expenses.xlsx','xlsx'], ['Backup.zip','zip'], ['Reference.png','png'], ['Downloads','folder'], ['Stickers.png','png'], ['Payslip.xlsx','xlsx'],
  ['Lease.pdf','pdf'], ['Journal.docx','docx'], ['Desktop.png','png'],
];
const EXTRA = [
  ['New Text Document.txt','txt'], ['New folder (2)','folder'], ['Invoice.pdf','pdf'], ['Data export.xlsx','xlsx'],
  ['Screenshot_0928.png','png'], ['Memo.txt','txt'], ['Archive.zip','zip'], ['New folder (3)','folder'],
];
const APPS = ['Recycle Bin','This PC','Mail','Teams','Slack','Zoom','Spotify','DaVinci Resolve','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','Dropbox','Chrome','Blender','Figma','Notion','Discord','Steam','Eagle','OBS','Postman','PureRef','ShareX','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['Games','folder'],['todolist','folder'],['OKR.xlsx','xlsx'],['Fixed costs.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['part.stp','txt'],['part.3dm','png'],['Preview','folder']];
const RIGHT = [['plot.log','txt'],['Tools','folder'],['archive.rar','zip'],['1685x128.png','png'],['image.jpg','png'],['0914.png','png'],
  ['image 2.jpg','png'],['images.png','png'],['Contents.docx','docx'],['api.txt','txt'],['c4ef.png','png'],['0918.png','png'],
  ['Board rev.pdf','pdf'],['recommend.txt','txt'],['button.stp','txt'],['New Text (2).txt','txt'],['ugstep21','txt'],['New Text (3).txt','txt'],
  ['Work plan.txt','txt'],['image 3.jpg','png'],['New DOCX.docx','docx'],['SEO.txt','txt'],['resend.txt','txt'],['Intro.txt','txt'],
  ['USER.pdf','pdf'],['New Text.txt','txt'],['Chair.pur','png'],['PAP-20.pdf','pdf'],['Slides.pptx','pdf'],['Issues.txt','txt']];
function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];
    out.push([c, r, name, name === 'Recycle Bin' ? 'bin' : name === 'This PC' ? 'pc' : 'app']);
  }
  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `Part layout ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, 'leg-test.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])
    out.push([c, r, `ScreenShot ${++sh}.png`, 'shot']);
  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],
    [16,4],[16,6],[17,4],[17,5],[17,6],[17,7],[19,4],[19,5],[19,8],[20,0],[20,4],[20,6],[21,0],[21,5],[21,6]]) {
    const f = RIGHT[rgt++ % RIGHT.length]; out.push([c, r, f[0], f[1]]);
  }
  return out;
}

/* ======================================================================
   CPU noise + tileable noise / caustic textures
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      const n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
// Tileable caustic network: bright thin lines along the edges of a jittered Voronoi diagram
function makeCausticImage() {
  const S = 256, G = 7, cell = S / G, d = new Uint8Array(S * S);
  const pts = [];
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++)
    pts.push([(i + 0.15 + 0.7 * hash2(i, j, 901)) * cell, (j + 0.15 + 0.7 * hash2(i, j, 902)) * cell]);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let f1 = 1e9, f2 = 1e9;
    const ci = Math.floor(x / cell), cj = Math.floor(y / cell);
    for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) {

/* ======================================================================
   Reef field (CPU): r = signed distance to the reef-patch edge (<0 inside a patch),

let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;

const depthOf = s => 0.3 * sstep(-5, 20, s) + 0.7 * sstep(12, 60 + 0.35 * P.sigma, s);

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);

const COMMON = `
float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);

  vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);

// ---------- Static bed: sand, seagrass, coral, depth tint. Rendered once per field change. ----------
const BED_FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uSigma;
out vec4 o;
${COMMON}
// ---- palette ----
const vec3 SAND_A = vec3(0.80, 0.67, 0.48), SAND_B = vec3(0.70, 0.57, 0.40), SAND_D = vec3(0.50, 0.47, 0.38);
const vec3 W_SHALLOW = vec3(0.24, 0.66, 0.72), W_MID = vec3(0.04, 0.50, 0.60), W_DEEP = vec3(0.025, 0.29, 0.42);
const vec3 GRASS_A = vec3(0.24, 0.42, 0.22), GRASS_B = vec3(0.50, 0.64, 0.30);
const vec3 PINK = vec3(0.95, 0.50, 0.47), ORANGE = vec3(0.97, 0.60, 0.27), VIOLET = vec3(0.62, 0.45, 0.80);
const vec3 OCHRE = vec3(0.84, 0.67, 0.30), ROSE = vec3(0.88, 0.36, 0.44), OLIVE = vec3(0.62, 0.66, 0.36);
const vec3 TAN = vec3(0.88, 0.62, 0.50), LILAC = vec3(0.80, 0.64, 0.90), MINT = vec3(0.48, 0.76, 0.64);
const vec3 LDIR = vec3(-0.45, -0.58, 0.68);               // sun at the top left (screen y points down)
const vec2 SH_DIR = vec2(0.6, 0.8);                       // shadows fall to the bottom right
const float CURRENT = 0.65;                               // seagrass leans with a gentle current (radians)

vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
vec2 field(vec2 p) {
  vec2 uv = (p / uStep + 0.5) / uGrid;
  return mix(texture(uFA, uv).rg, texture(uFB, uv).rg, uMix);
}
float depthOf(float s) { return 0.3 * ss(-5.0, 20.0, s) + 0.7 * ss(12.0, 60.0 + 0.35 * uSigma, s); }
vec3 pick3(vec3 a, vec3 b, vec3 c, float h) { return h < 0.34 ? a : (h < 0.67 ? b : c); }

// One coral colony in its local (rotated) frame. Returns colour + coverage; hg = height (for overlap order).
vec4 coralAt(vec2 q, float r, float t, float h, float hc, out float hg) {
  float rr = length(q), a = atan(q.y, q.x);
  vec3 col = vec3(0.0); float al = 0.0; hg = 0.0;
  if (t < 0.5) {
    // brain coral: a dome covered in meandering grooves
    float R = r * (1.0 + 0.07 * sin(a * 3.0 + h * 40.0) + 0.04 * sin(a * 7.0 + h * 13.0));
    al = ss(R + 0.7, R - 0.7, rr);
    float z = sqrt(max(1.0 - rr * rr / (R * R), 0.0)); hg = (0.5 + 0.5 * z) * r;
    vec3 base = pick3(OCHRE, TAN, OLIVE, hc * 1.25);
    float m = texture(uNoise, q / 46.0 + h * 7.3).r + texture(uNoise, q / 17.0 + h * 3.1).g * 0.3;
    float g = abs(fract(m * 6.5) - 0.5);
    float dif = lit(vec3(q / R * 1.1, z + 0.2));
    col = base * (0.52 + 0.62 * dif);
    col *= 1.0 - 0.40 * ss(0.16, 0.05, g);
    col += 0.08 * ss(0.36, 0.5, g) * dif;
    col *= mix(0.78, 1.0, ss(R, R * 0.7, rr));
  } else if (t < 1.5) {
    // branching (staghorn) coral seen from above: a rosette of forking branches with pale growing tips
    float m = 5.0 + floor(h * 4.0), seg = 6.2832 / m;
    float a2 = a + 0.22 * sin(rr * 0.28 + h * 20.0);
    float loc = mod(a2 + h * 3.0, seg) - 0.5 * seg;
    float fork = seg * 0.23 * ss(0.36 * r, 0.95 * r, rr);
    float d = rr * sin(min(abs(abs(loc) - fork), 1.5));
    float w = r * (0.12 - 0.05 * rr / r) + 0.75;
    float br = ss(w + 0.7, w - 0.7, d);
    float hub = ss(r * 0.26 + 0.8, r * 0.26 - 0.8, rr);
    al = max(br, hub) * ss(r + 0.5, r - 1.5, rr);
    float x = clamp(d / w, 0.0, 1.0);
    hg = (0.45 + 0.55 * (1.0 - rr / r)) * r;
    vec3 base = pick3(PINK, VIOLET, ORANGE, hc);
    vec3 tip = mix(base, vec3(1.0, 0.94, 0.86), 0.5);
    col = mix(base * 0.70, tip, ss(0.55 * r, 0.97 * r, rr));
    col *= 0.74 + 0.36 * (1.0 - x * x);
    col *= 0.92 + 0.10 * hash2(floor(q * 1.3) + h * 50.0);
  } else if (t < 2.5) {
    // sea fan: a lacy fan of ribs and cross-links leaning with the current, sand shows through the holes
    vec2 q2 = q + vec2(0.7 * r, 0.0);

    float F = 1.5 * r, span = 0.55 + 0.2 * h;
    float edge = F * (0.92 + 0.08 * sin(a2 * 9.0 + h * 30.0));
    float mask = ss(edge, edge - 1.5, r2) * ss(span, span - 0.12, abs(a2)) * ss(0.0, 2.0, r2);
    float nr = 9.0 + floor(h * 6.0);
    float rib = r2 * abs(sin((a2 + 0.04 * sin(r2 * 0.5)) * nr));
    float ribs = ss(0.9, 0.3, rib) * ss(F * 0.15, F * 0.3, r2);
    float arc = abs(fract(r2 / 3.4 + texture(uNoise, q / 30.0 + h).r * 1.5) - 0.5) * 3.4;
    float net = max(ss(0.75, 0.25, arc), ribs);
    float trunk = ss(1.3, 0.5, abs(q2.y) - 0.0) * ss(F * 0.35, F * 0.1, r2);
    al = mask * max(max(net * 0.95, 0.18), trunk);
    hg = r * 1.1;
    vec3 base = pick3(VIOLET, ROSE, ORANGE, hc);
    col = mix(base * 0.75, mix(base, vec3(1.0), 0.25), ss(0.3 * F, F, r2));
  } else {
    // sponge / boulder coral: a lumpy dome dotted with polyps
    vec2 dir = q / max(rr, 1.0);
    float R = r * (0.80 + 0.32 * texture(uNoise, dir * 0.07 + h * 5.0).r);
    al = ss(R + 0.7, R - 0.7, rr);
    float z = sqrt(max(1.0 - rr * rr / (R * R), 0.0)); hg = (0.4 + 0.5 * z) * r;
    vec3 base = hc < 0.85 ? pick3(ORANGE, LILAC, VIOLET, hc / 0.85) : MINT;
    float dif = lit(vec3(q / R, z + 0.25));
    col = base * (0.55 + 0.55 * dif);
    vec2 g = fract(q / 3.6 + h * 9.0) - 0.5;

    col *= mix(0.8, 1.0, ss(R, R * 0.7, rr));
  }

}

// Big colonies, one per 30px cell, clustered along the reef-patch edge
void coralLayer(vec2 p, inout vec3 col, inout float cover) {
  const float C = 24.0;
  vec2 c0 = floor(p / C);
  float shd = 0.0, bestH = -1.0; vec4 best = vec4(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cell = c0 + vec2(float(i), float(j));
    float h0 = hash2(cell + 0.37), h1 = hash2(cell + 3.71), h2 = hash2(cell + 9.13), h3 = hash2(cell + 5.29);
    vec2 c = (cell + 0.15 + 0.7 * vec2(h0, h1)) * C;
    vec2 f = field(c);
    float s = f.x, di = f.y;
    float bom = ss(140.0, 220.0, di);                     // open-water bommies (far from any icon): solid coral heads
    float band = mix(ss(-64.0, -40.0, s), 1.0, bom) * ss(18.0, 0.0, s);
    float clump = mix(ss(0.25, 0.55, N(c, 260.0).r), 1.0, bom);
    if (h2 > band * (0.25 + 0.75 * clump)) continue;
    float r = mix(8.0, 16.0, h3) * (0.6 + 0.4 * band);
    r = min(r, di - 7.0);
    if (r < 3.5) continue;
    vec2 d = p - c;
    vec2 ds = d - SH_DIR * (2.0 + r * 0.35);
    shd = max(shd, ss(r + 4.0, r - 4.0, length(ds)));
    if (dot(d, d) > r * r * 1.35) continue;
    float ang = h0 * 6.2832;
    float ty = floor(hash2(cell + 7.77) * 4.0);
    // fans are planar: always orient them across the current
    if (ty > 1.5 && ty < 2.5) ang = CURRENT + 1.57 + (h0 - 0.5) * 0.8;
    vec2 q = vec2(cos(ang) * d.x + sin(ang) * d.y, -sin(ang) * d.x + cos(ang) * d.y);
    float hg;
    vec4 cc = coralAt(q, r, ty, h3 * 0.7 + h0 * 0.3, hash2(cell + 2.22), hg);
    if (cc.a > 0.02 && hg > bestH) { best = cc; bestH = hg; }
  }
  col *= 1.0 - 0.32 * shd;
  col = mix(col, best.rgb, best.a);
  cover = max(cover, best.a);
}

// Small things, one per 13px cell: little coral heads and urchins near the reef, starfish and shells on the sand
void smallLayer(vec2 p, inout vec3 col, inout float cover) {
  const float C = 13.0;
  vec2 c0 = floor(p / C);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cell = c0 + vec2(float(i), float(j));
    float h0 = hash2(cell + 11.3), h1 = hash2(cell + 13.7), h2 = hash2(cell + 17.9), h3 = hash2(cell + 19.1), h4 = hash2(cell + 23.3);
    vec2 c = (cell + 0.15 + 0.7 * vec2(h0, h1)) * C;
    vec2 f = field(c);
    float s = f.x, di = f.y;
    float band = ss(-60.0, -42.0, s) * ss(30.0, 6.0, s) * ss(0.3, 0.6, N(c + 77.0, 220.0).g);
    float sand = ss(-28.0, -46.0, s);
    vec2 d = p - c;
    float rr = length(d);
    if (h2 < band * 0.22) {
      if (di < 9.0) continue;
      if (h3 < 0.72) {
        // little coral head
        float r = 2.6 + 3.0 * h4;
        col *= 1.0 - 0.25 * ss(r + 2.5, r - 2.0, length(d - SH_DIR * 2.0));
        float al = ss(r + 0.6, r - 0.6, rr);
        float z = sqrt(max(1.0 - rr * rr / (r * r), 0.0));
        vec3 base = h4 < 0.33 ? PINK : (h4 < 0.66 ? LILAC : ORANGE);
        vec3 cc = base * (0.55 + 0.6 * lit(vec3(d / r, z + 0.2)));
        col = mix(col, cc, al); cover = max(cover, al);
      } else {
        // sea urchin: dark core with a halo of thin spines
        float a = atan(d.y, d.x);
        float sp = rr * abs(sin(a * 9.0 + h4 * 6.0));
        float spines = ss(0.7, 0.2, sp) * ss(6.5, 3.0, rr) * 0.75;
        float core = ss(2.6, 2.0, rr);
        col *= 1.0 - 0.25 * ss(5.0, 1.5, length(d - SH_DIR * 2.5));
        vec3 uc = vec3(0.14, 0.08, 0.17);
        col = mix(col, uc, max(spines, core));
        col += vec3(0.25, 0.2, 0.3) * ss(1.0, 0.0, length(d + vec2(0.7, 0.8))) * core;
        cover = max(cover, core);
      }
    } else if (h2 > 1.0 - sand * 0.05 * ss(14.0, 20.0, di) + 0.0 && h3 < 0.38) {
      // starfish on the sand (never under an icon)
      float R = 4.5 + 3.0 * h4;
      if (di < R + 3.0) continue;
      float a = atan(d.y, d.x) + h0 * 6.2832;
      float rad = R * (0.32 + 0.68 * pow(0.5 + 0.5 * cos(5.0 * a), 1.6));
      float al = ss(rad + 0.6, rad - 0.6, rr);
      vec3 base = h1 < 0.45 ? vec3(0.88, 0.40, 0.22) : (h1 < 0.75 ? vec3(0.25, 0.42, 0.82) : vec3(0.86, 0.72, 0.48));
      vec3 sc = base * (0.80 + 0.30 * ss(rad, 0.0, rr));
      sc *= 1.0 - 0.15 * step(0.6, hash2(floor(d * 1.2) + h3));
      col *= 1.0 - 0.18 * ss(rad + 2.0, rad - 2.0, length(d - SH_DIR * 1.5));
      col = mix(col, sc, al); cover = max(cover, al);
    } else if (h2 > 1.0 - sand * 0.14 && di > 6.0) {
      // shell / pebble
      float r = 1.3 + 1.4 * h4;
      vec2 e = vec2(d.x, d.y * 1.4);
      float al = ss(r + 0.5, r - 0.5, length(e)) * 0.85;
      vec3 sc = mix(vec3(0.95, 0.89, 0.80), vec3(0.62, 0.55, 0.48), h3);
      col *= 1.0 - 0.2 * ss(r + 1.5, r - 1.0, length(e - SH_DIR * 1.0));
      col = mix(col, sc, al);
    }
  }
}

// Seagrass tufts, one per 15px cell: blades streaming with the current
void grassLayer(vec2 p, inout vec3 col) {
  const float C = 15.0;
  vec2 c0 = floor(p / C);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cell = c0 + vec2(float(i), float(j));
    float h0 = hash2(cell + 31.1), h1 = hash2(cell + 37.3), h2 = hash2(cell + 41.7);
    vec2 c = (cell + 0.15 + 0.7 * vec2(h0, h1)) * C;
    vec2 f = field(c);
    float s = f.x, di = f.y;
    float meadow = ss(6.0, 20.0, s) * ss(95.0, 45.0, s) * ss(0.42, 0.62, N(c, 260.0).g);
    float lagoon = ss(-30.0, -48.0, s) * ss(10.0, 18.0, di) * 0.5 * ss(0.58, 0.75, N(c + 40.0, 200.0).b);
    if (h2 > max(meadow * 0.9, lagoon)) continue;
    float baseAng = CURRENT + (N(c, 500.0).r - 0.5) * 1.2;
    for (int b = 0; b < 5; b++) {
      float fb = float(b);
      float hb = hash2(cell + fb * 3.3 + 11.0), hl = hash2(cell + fb * 5.1 + 2.0);
      float ang = baseAng + (hb - 0.5) * 2.0;
      float L = 6.0 + 7.0 * hl;
      vec2 dir = vec2(cos(ang), sin(ang)), nrm = vec2(-dir.y, dir.x);
      vec2 a0 = c + nrm * (hb - 0.5) * 3.0;
      vec2 m = a0 + dir * L * 0.5 + nrm * L * 0.10 * (hl - 0.5);
      vec2 e = a0 + dir * L + nrm * L * 0.45 * (hb - 0.5);
      float d1 = sdSeg(p, a0, m, 1.05, 0.8), d2 = sdSeg(p, m, e, 0.8, 0.25);
      float d = min(d1, d2);
      if (d > 2.5) continue;
      float u = d1 < d2 ? 0.25 : 0.75;
      // soft shadow just beside the blade
      float ds = min(sdSeg(p - SH_DIR * 1.6, a0, m, 1.3, 1.0), sdSeg(p - SH_DIR * 1.6, m, e, 1.0, 0.4));
      col *= 1.0 - 0.16 * ss(1.2, -0.6, ds);
      vec3 gc = mix(GRASS_A, GRASS_B, u * (0.6 + 0.4 * hl)) * (0.88 + 0.24 * hb);

  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  vec2 f = field(p);
  float s = f.x;
  float sN = s + (N(p, 180.0).r - 0.5) * 16.0;              // break up the contours a little
  float dep = depthOf(sN);

  // ---------- sand: warm mid-tone patches, current ripples, fine grain ----------
  float b1 = N(p, 520.0).b, b2 = N(p + 211.0, 140.0).g;
  vec3 sand = mix(SAND_B, SAND_A, ss(0.25, 0.8, b1 * 0.7 + b2 * 0.3));
  float ra = (N(p, 900.0).r - 0.5) * 1.6 + CURRENT + 1.57;
  vec2 rd = vec2(cos(ra), sin(ra));
  float rip = sin(dot(p, rd) * 0.42 + N(p, 70.0).g * 8.0);
  sand *= 1.0 + 0.05 * rip * ss(0.5, 0.0, N(p + 90.0, 300.0).a + 0.0) ;
  sand *= 1.0 + (hash2(floor(p * max(uScale, 1.0) * 0.9)) - 0.5) * 0.06;
  // deeper bottom: darker sand with rubble and algae patches
  vec3 col = mix(sand, SAND_D * (0.8 + 0.4 * N(p, 120.0).r), ss(0.12, 0.6, dep));
  float rocks = ss(0.56, 0.74, N(p + 500.0, 160.0).r) * ss(0.25, 0.75, dep);
  col = mix(col, vec3(0.20, 0.30, 0.28), rocks * 0.7);
  col *= 1.0 - 0.25 * ss(0.4, 1.0, dep) * ss(0.35, 0.7, N(p + 333.0, 600.0).g);   // deep seagrass beds / rubble fields far below

  float cover = 0.0;
  // each layer only where its band can reach (cell centres are at most ~35px away from p)
  if (s < 125.0) grassLayer(p, col);
  if (s < 60.0) smallLayer(p, col, cover);
  if (s > -105.0 && s < 50.0) coralLayer(p, col, cover);

  // ---------- water: tint by depth; corals reach up toward the surface so they are tinted less ----------
  vec3 wcol = mix(W_SHALLOW, W_MID, ss(0.0, 0.45, dep));
  wcol = mix(wcol, W_DEEP, ss(0.4, 1.0, dep));
  wcol *= 0.92 + 0.16 * N(p, 700.0).r;

  col = mix(col, wcol, absb);
  // drop-off just outside the reef edge reads a little darker
  col *= 1.0 - 0.14 * ss(0.0, 30.0, sN) * ss(120.0, 40.0, sN);
  o = vec4(col, dep);
}`;

const FISH_FS = `#version 300 es
precision highp float;
in vec2 vL;
flat in vec4 vB;
flat in vec4 vC;
uniform float uShadow;
uniform vec3 uTint;
out vec4 o;
${COMMON}

  else if (sp < 1.5) { back = vec3(0.95, 0.72, 0.10); side = vec3(1.00, 0.89, 0.36); }   // yellow tang
  else if (sp < 2.5) { back = vec3(0.30, 0.42, 0.52); side = vec3(0.82, 0.89, 0.93); }   // silver jack
  else if (sp < 3.5) { back = vec3(0.60, 0.65, 0.40); side = vec3(0.94, 0.93, 0.66); }   // sergeant major
  else               { back = vec3(0.94, 0.42, 0.28); side = vec3(1.00, 0.70, 0.50); }   // orange anthias

const TURTLE_FS = `#version 300 es
precision highp float;
in vec2 vL;
flat in vec4 vB;
flat in vec4 vC;
uniform float uShadow;
uniform vec3 uTint;
out vec4 o;
${COMMON}
float sdEll(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }
const vec2 SD[13] = vec2[13](vec2(0.62, 0.0), vec2(0.28, 0.0), vec2(-0.06, 0.0), vec2(-0.40, 0.0), vec2(-0.72, 0.0),
  vec2(0.42, 0.56), vec2(0.08, 0.64), vec2(-0.26, 0.62), vec2(-0.56, 0.48),
  vec2(0.42, -0.56), vec2(0.08, -0.64), vec2(-0.26, -0.62), vec2(-0.56, -0.48));
void main() {
  float L = vB.x, ph = vB.z;
  vec2 q = vL, a = vec2(q.x, abs(q.y));
  float st = 0.5 + 0.5 * sin(ph);                         // flipper stroke: 0 tucked back, 1 spread forward
  // shell, slightly narrower toward the back
  vec2 sc = q - vec2(-0.03, 0.0);
  float tap = 1.0 - 0.16 * ss(0.0, -0.3, sc.x);
  float dS = sdEll(vec2(sc.x, sc.y / tap), vec2(0.30, 0.235));
  // head and neck
  float hs = 0.02 * sin(ph * 0.5 + 0.7);
  float dH = min(sdEll(q - vec2(0.385, hs), vec2(0.095, 0.072)), sdSeg(q, vec2(0.22, 0.0), vec2(0.35, hs * 0.7), 0.06, 0.055));
  // long front flippers sweep between spread forward (power stroke) and tucked along the shell (glide)
  float fa = 0.95 + 1.15 * (1.0 - st);
  vec2 sh = vec2(0.14, 0.16);
  vec2 mid = sh + vec2(cos(fa), sin(fa)) * 0.19;
  vec2 tip = mid + vec2(cos(fa + 0.5), sin(fa + 0.5)) * 0.24;
  float dF = min(sdSeg(a, sh, mid, 0.058, 0.046), sdSeg(a, mid, tip, 0.046, 0.012));
  float ra = 2.35 + 0.25 * sin(ph + 1.2);
  vec2 rs = vec2(-0.22, 0.12);
  float dR = sdSeg(a, rs, rs + vec2(cos(ra), sin(ra)) * 0.13, 0.045, 0.018);
  float dTl = sdSeg(q, vec2(-0.30, 0.0), vec2(-0.38, 0.0), 0.025, 0.004);
  float dSkin = min(min(dH, dF), min(dR, dTl));
  float d = min(dS, dSkin) * L;
  if (uShadow > 0.5) {
    float bl = 1.2 + 4.0 * vC.w;
    float al = ss(bl, -bl, d) * (0.34 - 0.14 * vC.w) * vC.z;
    o = vec4(vec3(0.0, 0.03, 0.07) * al, al);
    return;
  }
  // skin: grey-olive with pale scale borders and paler flipper edges
  vec3 skin = vec3(0.42, 0.45, 0.34);
  vec2 g = fract(q * L / 3.4) - 0.5;
  skin *= 0.90 + 0.12 * ss(0.48, 0.30, length(g));
  skin = mix(skin, vec3(0.80, 0.78, 0.64), ss(-0.018, 0.0, dSkin) * 0.55);
  skin *= 0.85 + 0.25 * ss(0.0, -0.05, q.x - 0.3) * step(0.25, q.x);
  // shell: amber scutes with radiating streaks, pale borders, a ring of marginal scutes, dome shading
  vec2 n = vec2(sc.x / 0.30, sc.y / (0.235 * tap));
  float f1 = 9.0, f2 = 9.0; vec2 cc = vec2(0.0);
  for (int i = 0; i < 13; i++) {
    float dd = length(n - SD[i]);
    if (dd < f1) { f2 = f1; f1 = dd; cc = SD[i]; } else if (dd < f2) f2 = dd;
  }
  float rim = length(n);
  vec2 dv = n - cc;
  float streak = 0.5 + 0.5 * sin(atan(dv.y, dv.x) * 7.0 + f1 * 6.0);
  vec3 shell = mix(vec3(0.62, 0.45, 0.20), vec3(0.30, 0.21, 0.11), ss(0.05, 0.42, f1));
  shell *= 0.86 + 0.18 * streak;
  float border = ss(0.07, 0.02, f2 - f1) * step(rim, 0.82);
  float ma = abs(fract(atan(n.y, n.x) / 6.2832 * 24.0) - 0.5);
  float marg = ss(0.80, 0.84, rim);
  border = max(border, ss(0.035, 0.0, abs(rim - 0.82)));
  border = max(border, marg * ss(0.08, 0.02, ma));
  shell = mix(shell, vec3(0.42, 0.33, 0.20), marg * 0.6);
  shell = mix(shell, vec3(0.82, 0.74, 0.55), border * 0.75);
  float z = sqrt(max(1.0 - rim * rim, 0.0));
  vec3 nn = normalize(vec3(n * 0.75, z + 0.3));
  shell *= 0.62 + 0.55 * max(dot(nn, normalize(vec3(-0.45, -0.58, 0.68))), 0.0);
  vec3 col = mix(skin, shell, ss(0.6, -0.6, dS * L));
  col = mix(col, uTint, 0.12 + 0.12 * vC.w);
  float al = ss(0.6, -0.6, d);
  o = vec4(col * al, al) * vC.z;
}`;

    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 48, nf * 48 + 32);
    drawSprites(TURTLE, 1, [0.6, 0.6], true);
    for (let k = 0; k < 3; k++) gl.vertexAttribPointer(k, 4, gl.FLOAT, false, 48, k * 16);
  }
  if (nf) drawSprites(FISH, nf, [0.62, 0.42], true);
  if (hasT) {
    for (let k = 0; k < 3; k++) gl.vertexAttribPointer(k, 4, gl.FLOAT, false, 48, nf * 48 + k * 16);
    drawSprites(TURTLE, 1, [0.6, 0.6], false);
    for (let k = 0; k < 3; k++) gl.vertexAttribPointer(k, 4, gl.FLOAT, false, 48, k * 16);
  }
  if (nf) drawSprites(FISH, nf, [0.62, 0.42], false);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(emptyVAO);
  if (measure) { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); frameMs = performance.now() - t0; }
}

/* ======================================================================
   Panel (standalone demo)
   ====================================================================== */
const statsEl = document.getElementById('stats');
const GPU = (() => {
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  return name.replace(/^ANGLE \([^,]+,\s*/, '').replace(/\s*\(0x[0-9a-f]+\).*$/i, '')
    .replace(/\s*(Direct3D|vs_|OpenGL).*$/, '').replace(/\(R\)|\(TM\)/g, '').trim();
})();
function updateStats() {
  const nfish = schools.reduce((a, s) => a + s.fish.length, 0);
  statsEl.innerHTML =
    `<span class="live">● live · ${fpsEMA.toFixed(0)} fps</span><br>GPU ${GPU}<br>` +
    `frame ${frameMs.toFixed(1)} ms · bed ${bedMs.toFixed(1)} ms · field ${fieldMs.toFixed(0)} ms<br>` +
    `canvas ${cv.width}×${cv.height} · icons ${icons.length} · fish ${nfish}`;
}
function syncPanel() {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === layoutKind));
  document.querySelectorAll('.toggles input').forEach(inp => { inp.checked = !!P[inp.dataset.key]; });
}
const slidersEl = document.getElementById('sliders');
for (const s of SLIDERS) {
  const wrap = document.createElement('div');
  wrap.className = 'slider';
  wrap.innerHTML = `<div class="row"><span>${s.label}</span><span></span></div><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.key]}">`;
  const out = wrap.querySelector('.row span:last-child'), inp = wrap.querySelector('input');
  out.textContent = s.fmt(P[s.key]);
  inp.addEventListener('input', () => {
    P[s.key] = +inp.value; out.textContent = s.fmt(P[s.key]);
    if (s.act === 'field') refresh();
  });
  slidersEl.appendChild(wrap);
}
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyLayout(b.dataset.v); syncPanel();
});
document.querySelectorAll('.toggles input').forEach(inp => inp.addEventListener('change', () => {
  const k = inp.dataset.key;
  P[k] = typeof DEFAULTS[k] === 'number' ? (inp.checked ? 1 : 0) : inp.checked;
}));
document.getElementById('collapse').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.classList.toggle('collapsed');
  document.getElementById('collapse').textContent = p.classList.contains('collapsed') ? '+' : '–';
});
// New seed (settings "refresh" / panel button). Before the first icons arrive in hosted mode, just remember it
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  if (!iconsSeen) return;
  commit(true);
}
document.getElementById('btnSeed').addEventListener('click', () => reseed((Math.random() * 1e6) | 0));
document.getElementById('btnAdd').addEventListener('click', () => {
  const f = EXTRA[extraIdx++ % EXTRA.length];
  let pos = null;
  for (let t = 0; t < 300 && !pos; t++) {
    const c = cellPos(Math.floor(Math.random() * grid.cols), Math.floor(Math.random() * grid.rows));
    if (!occupied(c.x, c.y, null)) pos = c;
  }
  if (!pos) return;
  const ic = addIcon(f, pos, true);
  select(ic);
  commit();
});
desktop.addEventListener('pointerdown', () => select(null));
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    const ic = selected; select(null); ic.el.remove(); icons = icons.filter(x => x !== ic); commit();
  } else if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
});
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (WALL || PREVIEW) { resize(); refresh(); return; }
    resize(); computeGrid();
    if (grid.cols * grid.rows > layoutCapacity && layoutCapacity < 40) { applyLayout(layoutKind); syncPanel(); return; }
    for (const ic of icons) setPos(ic, Math.min(ic.x, Math.max(0, DW - ic.w)), Math.min(ic.y, Math.max(0, DH - ic.h)));
    refresh();
  }, 100);
});
function tickClock() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  document.getElementById('clock').innerHTML = `${z(d.getHours())}:${z(d.getMinutes())}<br>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
setInterval(tickClock, 15000); tickClock();

/* ---------- start ---------- */
window.__dbg = {
  P, applyLayout, schools, turtle, spawnTurtle, commit, refresh,
  get icons() { return icons; },
  bench() {
    const ts = [], bs = [];
    for (let i = 0; i < 10; i++) { const a = performance.now(); draw(performance.now()); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ts.push(performance.now() - a); }
    for (let i = 0; i < 5; i++) { cacheOK = false; const a = performance.now(); draw(performance.now()); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); bs.push(performance.now() - a); }
    const ls = [];
    for (let i = 0; i < 5; i++) { const a = performance.now(); renderBed(true); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ls.push(performance.now() - a); }
    cacheOK = false; draw(performance.now());
    ts.sort((a, b) => a - b); bs.sort((a, b) => a - b); ls.sort((a, b) => a - b);
    return { frame: +ts[5].toFixed(1), withBedRebuild: +bs[2].toFixed(1), morphBedHalfRes: +ls[2].toFixed(1), field: +fieldMs.toFixed(1), canvas: cv.width + 'x' + cv.height, gpu: GPU };
  },
};
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else { applyLayout('mine'); syncPanel(); }
requestAnimationFrame(frame);

/* ======================================================================
   Hosted mode: the scene is driven from outside
   - wallpaper (?wallpaper=1): the desktop host sends messages through WebView2
   - preview (?preview=1): the settings window (settings.html) sends messages via iframe postMessage
   Messages: icons (real icon rects, physical px) / settings (partial params) / reset (defaults) / pause
   ====================================================================== */
// Only accept the keys this theme exposes; reef size needs a new field
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, adaptiveChanged = false;
  for (const k in v) {
    if ((!SLIDERS.some(s => s.key === k) && !DISPLAY_KEYS.includes(k)) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    if (DISPLAY_KEYS.includes(k) && v[k] !== 0 && v[k] !== 1) continue;
    P[k] = v[k];
    if (k === 'adaptive') adaptiveChanged = true;
    if (k === 'sigma') field = true;
  }
  if (adaptiveChanged && FB) commit();
  else if (field && FB) refresh();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);                                   // open sea until we know where the icons are
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical px → CSS px
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: the reef grows in; afterwards it follows the icons
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
