<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Terrarium app icon: a glass globe holding a small landscape (hill, sprout, sun) on a wooden base. -->
  <defs>
    <clipPath id="glass"><circle cx="128" cy="116" r="92"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeaf0"/><stop offset="1" stop-color="#e6f7f2"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcf74"/><stop offset="1" stop-color="#5ea95a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9e4f"/><stop offset="1" stop-color="#2f7444"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9784a"/><stop offset="1" stop-color="#7a4a2c"/>
    </linearGradient>
  </defs>
  <!-- wooden base -->
  <rect x="58" y="196" width="140" height="34" rx="12" fill="url(#base)"/>
  <rect x="58" y="196" width="140" height="8" rx="4" fill="#d29563" opacity=".6"/>
  <!-- globe contents -->
  <g clip-path="url(#glass)">
    <rect x="30" y="20" width="200" height="200" fill="url(#sky)"/>
    <circle cx="170" cy="70" r="17" fill="#ffd45c"/>
    <path d="M20 168 C 60 118, 112 120, 150 146 S 220 150, 240 136 V 230 H 20 Z" fill="url(#hillBack)"/>
    <path d="M20 188 C 70 160, 130 162, 170 178 S 222 182, 240 172 V 230 H 20 Z" fill="url(#hillFront)"/>
    <!-- sprout -->
    <path d="M100 166 C 100 150, 101 138, 104 124" stroke="#245c34" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M104 128 C 86 124, 76 110, 78 96 C 94 98, 104 110, 104 128 Z" fill="#3c8a45"/>
    <path d="M104 132 C 118 120, 136 120, 146 128 C 136 140, 118 142, 104 132 Z" fill="#5fb05a"/>
  </g>
  <!-- glass: rim, shading and highlights -->
  <circle cx="128" cy="116" r="92" fill="none" stroke="#2c6a70" stroke-width="9"/>
  <path d="M60 78 A 76 76 0 0 1 112 42" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity=".75"/>
  <circle cx="58" cy="100" r="5" fill="#fff" opacity=".7"/>
</svg>
